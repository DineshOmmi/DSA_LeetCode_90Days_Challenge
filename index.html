<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>90-Day DSA Mastery</title>
<style>
:root{color-scheme:light dark;--fg:#1f2328;--bgc:#fff;--E:#2fa84f;--M:#e39b00;--H:#e5484d}
@media (prefers-color-scheme:dark){:root{--fg:#ececec;--bgc:#191919;--E:#3dd16a;--M:#f5b73b;--H:#ff6369}}
:root{--mute:color-mix(in srgb,var(--fg) 56%,transparent);--line:color-mix(in srgb,var(--fg) 12%,transparent);--soft:color-mix(in srgb,var(--fg) 6%,transparent)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
body{color:var(--fg);font:14px/1.45 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
main{width:100%;padding:6px 2px 24px}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 20px;margin-bottom:12px}
.ttl{display:flex;align-items:baseline;gap:6px 12px;flex-wrap:wrap}
h1{margin:0;font-size:21px;font-weight:750;letter-spacing:-.02em}
.sub{margin:0;color:var(--mute);font-size:12.5px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--line);border-radius:99px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:transparent;color:var(--mute);font-size:12px;padding:4px 12px;border-radius:99px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:color-mix(in srgb,var(--fg) 12%,transparent);color:var(--fg);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.tile{--c:var(--E);padding:10px 12px 11px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--c) 7%,transparent)}
.tile .tl{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.tile .tl span{font-size:12px;color:var(--mute);display:flex;align-items:center;gap:6px}
.tile .tl span i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tile b{font-size:19px;font-weight:700;letter-spacing:-.01em}
.tile b small{font-size:12px;font-weight:500;color:var(--mute);margin-left:2px}
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--c);transition:width .35s}
.tile.all{--c:var(--E)}
.tile.all .bar i{background:linear-gradient(90deg,var(--E),#4cc9a7)}
.tile .ft{margin-top:6px;font-size:11px;color:var(--mute)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:99px;padding:3px 10px 3px 8px;font-size:12px;cursor:pointer;white-space:nowrap;transition:background .15s}
.chip:hover{background:var(--soft)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip[aria-pressed=true]{background:color-mix(in srgb,var(--c) 20%,transparent);border-color:color-mix(in srgb,var(--c) 42%,transparent)}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;color:var(--mute);font-size:12px;margin:0 0 10px}
.key .d{display:inline-flex;align-items:center;gap:5px}
.key .d b{width:8px;height:8px;border-radius:50%}
.sp{flex:1}
.mini{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.mini input,.mini button{font-size:12px;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:8px;padding:3px 9px}
.mini button{cursor:pointer;color:var(--mute)}
.mini button:hover{background:var(--soft)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.wk{grid-column:1/-1;display:flex;align-items:baseline;gap:10px;margin:8px 2px 0;font-size:12px;color:var(--mute)}
.wk:first-child{margin-top:0}
.wk b{color:var(--fg);font-size:12.5px;letter-spacing:.02em;text-transform:uppercase}
.wk i{flex:1;height:1px;background:var(--line);align-self:center}
.day{--c:#888;display:flex;flex-direction:column;gap:6px;padding:9px 10px;border-radius:12px;background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 16%,transparent);transition:transform .18s,opacity .2s,background .2s}
@media (hover:hover){.day:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--c) 14%,transparent)}}
.day.dim{opacity:.2}
.day.rv{background:transparent;border:1px dashed var(--line)}
.day.mk{background:color-mix(in srgb,var(--fg) 8%,transparent);border-color:var(--line)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px}
.dn{font-weight:700;font-size:13px;color:var(--fg);text-decoration:none;white-space:nowrap}
.dn:hover{text-decoration:underline}
.dn small{font-weight:500;color:var(--mute);margin-left:6px;font-size:11px}
.pt{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--mute);white-space:nowrap;max-width:100%}
.pt i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.tag{display:none;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--fg);color:var(--bgc);padding:1px 7px;border-radius:99px}
.day.today .tag{display:inline-block}
.day ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.day li label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:12px;line-height:1.28;padding:3px 0}
.day li input{appearance:none;-webkit-appearance:none;flex:none;width:16px;height:16px;margin:0;border-radius:50%;border:1.6px solid color-mix(in srgb,var(--c) 65%,transparent);background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .15s}
.day li input::after{content:"";width:8px;height:4px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px) scale(0);transition:transform .15s}
.day li input:checked{background:var(--c);border-color:var(--c)}
.day li input:checked::after{transform:rotate(-45deg) translate(1px,-1px) scale(1)}
.day li span{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.day li a{color:inherit;text-decoration:none}
.day li a:hover{text-decoration:underline}
.day li em{flex:none;width:7px;height:7px;border-radius:50%;margin-top:5px}
.day li input:checked~span{color:var(--mute);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--fg) 30%,transparent)}
.note{margin:0;font-size:11.5px;color:var(--mute)}
.day.full .hd::after{content:"\2713";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--E);color:#fff;font-size:11px;font-weight:700;order:3}
footer{margin-top:12px;color:var(--mute);font-size:12px}
:focus-visible{outline:2px solid color-mix(in srgb,var(--fg) 45%,transparent);outline-offset:2px}
:focus:not(:focus-visible){outline:none}
@media (max-width:1020px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){
  main{padding:4px 0 18px}
  h1{font-size:19px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .tools{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tools::-webkit-scrollbar{display:none}
  .ctl{width:100%}
  .seg{flex:1 1 auto}
  .sp{display:none}
  .tile b{font-size:17px}
}
</style>
</head>

try{const r=localStorage.getItem("lc150c");if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
const inTab=n=>n>=RNG[st.tab][0]&&n<=RNG[st.tab][1];
const dayNo=()=>Math.floor((new Date(new Date().toDateString())-new Date(st.start+"T00:00:00"))/864e5)+1;
if(st.tab<0||st.tab>3){const n=dayNo();st.tab=n>56&&n<=90?2:n>28&&n<=56?1:0}
let ref=null,timer=null,saving=false,pending=false,lsOk=true;
try{localStorage.setItem("_t","1");localStorage.removeItem("_t")}catch(e){lsOk=false}
const stat=t=>{$("sv").textContent=t};
const payload=()=>({done:st.done,start:st.start,filter:st.filter,tab:st.tab});
async function flush(){if(!ref)return;if(saving){pending=true;return}saving=true;try{await ref.set(payload());stat("Saved to your account")}catch(e){stat(lsOk?"Saved in this browser only":"Could not save")}saving=false;if(pending){pending=false;flush()}}
const save=()=>{try{localStorage.setItem("lc150c",JSON.stringify(st))}catch(e){}clearTimeout(timer);timer=setTimeout(flush,600)};
async function initDb(){
  try{
    if(!window.claude||!window.claude.use)throw 0;
    const[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    if(!db||!user)throw 0;
    const id=await user.id();if(!id)throw 0;
    ref=db.doc("data/users/"+id+"/progress2");
    const sn=await ref.get();
    if(sn.exists){const d=sn.data();st.done=d.done||{};st.start=d.start||st.start;st.filter=d.filter||"";if(typeof d.tab==="number")st.tab=d.tab;try{localStorage.setItem("lc150c",JSON.stringify(st))}catch(e){}$("sd").value=st.start;render();stat("Synced with your account")}
    else{await flush()}
  }catch(e){stat(lsOk?"Saved in this browser only":"Progress can't be saved in this view")}
}
const fmt=d=>d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
const dateOf=n=>{if(!st.start)return null;const d=new Date(st.start+"T00:00:00");d.setDate(d.getDate()+n-1);return d};
let EL=[],WK=[];
function render(){
  const g=$("grid");g.textContent="";EL=[];WK=[];
  const today=new Date().toDateString();
  days.forEach(d=>{
    if(d.n%7===1){const w=(d.n-1)/7+1,a=dateOf(d.n),b=dateOf(Math.min(d.n+6,90));const h=E("div","wk","<b>Week "+w+"</b><span>"+(a?fmt(a)+" – "+fmt(b):"Days "+d.n+"–"+Math.min(d.n+6,90))+"</span><i></i>");h.dataset.n=d.n;g.appendChild(h);WK.push(h)}
    const[name,col]=P[d.k];
    const el=E("section","day"+(d.k==="rv"?" rv":d.k==="mk"?" mk":""));el.style.setProperty("--c",col);el.dataset.k=d.k;el.id="day"+d.n;
    const dt=dateOf(d.n);
    if(dt&&dt.toDateString()===today)el.classList.add("today");
    const hd=E("div","hd");
    const a=E("a","dn","Day "+d.n+(dt?"<small>"+fmt(dt)+"</small>":""));a.href="https://www.notion.so/3ec125c5bdb681"+NID[d.n-1];a.target="_blank";a.rel="noopener";a.title="Open notes for Day "+d.n;
    hd.append(a,E("span","tag","Today"),E("span","pt","<i></i>"+name));
    el.appendChild(hd);
    const ul=E("ul");
    const items=d.k==="rv"?[[d.items[0][0],"",""]]:d.items;
    items.forEach((it,i)=>{
      const id="d"+d.n+"_"+i;
      const li=E("li"),lb=E("label");
      const cb=E("input");cb.type="checkbox";cb.checked=!!st.done[id];cb.setAttribute("aria-label",it[0]);
      cb.onchange=()=>{st.done[id]=cb.checked;save();stats()};
      const sp=E("span");sp.title=it[0];
      if(it[2]){const l=E("a");l.href="https://leetcode.com/problems/"+it[2]+"/";l.target="_blank";l.rel="noopener";l.textContent=it[0];sp.appendChild(l)}else sp.textContent=it[0];
      lb.append(cb,sp);
      if("EMH".includes(it[1])&&it[1]){const em=E("em");em.style.background="var(--"+it[1]+")";em.title={E:"Easy",M:"Medium",H:"Hard"}[it[1]];lb.appendChild(em)}
      li.appendChild(lb);ul.appendChild(li);
    });
    el.appendChild(ul);
    if(d.k==="rv")el.appendChild(E("p","note","Redo without peeking at old code"));
    if(d.k==="mk")el.appendChild(E("p","note","No hints, grade yourself"));
    g.appendChild(el);EL.push(el);
  });
  applyFilter();applyTab();stats();
}
function stats(){
  const dn={E:0,M:0,H:0};let daysDone=0;
  days.forEach(d=>{
    const el=EL[d.n-1];
    const n=d.k==="rv"?1:d.items.length;let all=true;
    for(let i=0;i<n;i++){const on=!!st.done["d"+d.n+"_"+i];if(on&&study(d)&&dn[d.items[i][1]]!=null)dn[d.items[i][1]]++;if(!on)all=false}
    el.classList.toggle("full",all);if(all)daysDone++;
  });
  const sum=dn.E+dn.M+dn.H;
  const tiles=[["all","Solved",sum,ALL,"",daysDone+" of 90 days complete"],["","Easy",dn.E,TOT.E,"--E"],["","Medium",dn.M,TOT.M,"--M"],["","Hard",dn.H,TOT.H,"--H"]];
  const box=$("tiles");
  if(!box.children.length)tiles.forEach(()=>box.appendChild(E("div","tile")));
  tiles.forEach((t,i)=>{
    const el=box.children[i];el.className="tile"+(t[0]?" "+t[0]:"");
    if(t[4])el.style.setProperty("--c","var("+t[4]+")");
    const pct=t[3]?Math.round(t[2]/t[3]*100):0;
    el.innerHTML='<div class="tl"><span>'+(t[0]?"":"<i></i>")+t[1]+'</span><b>'+t[2]+'<small>/'+t[3]+'</small></b></div><div class="bar"><i style="width:'+pct+'%"></i></div>'+(t[5]?'<div class="ft">'+pct+'% · '+t[5]+'</div>':'<div class="ft">'+pct+'% done · '+(t[3]-t[2])+' left</div>');
  });
  const n=dayNo();
  $("when").textContent=n<1?"Starts "+fmt(dateOf(1)):n>90?"90-day plan finished":"Day "+n+" of 90 · "+(90-n)+" days left";
}
function applyFilter(){
  EL.forEach(el=>el.classList.toggle("dim",!!st.filter&&el.dataset.k!==st.filter));
  [...$("chips").children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.k===st.filter));
}
function applyTab(){EL.forEach((el,i)=>el.hidden=!inTab(i+1));WK.forEach(h=>h.hidden=!inTab(+h.dataset.n));[...$("tabs").children].forEach((b,i)=>b.setAttribute("aria-pressed",i===st.tab))}
Object.keys(P).forEach(k=>{
  const b=E("button","chip","<i></i>"+P[k][0]);b.dataset.k=k;b.style.setProperty("--c",P[k][1]);
  b.onclick=()=>{st.filter=st.filter===k?"":k;save();applyFilter()};
  $("chips").appendChild(b);
});
TL.forEach((t,i)=>{const b=E("button","",t);b.onclick=()=>{st.tab=i;save();applyTab()};$("tabs").appendChild(b)});
$("sd").value=st.start;
$("sd").onchange=e=>{if(!e.target.value)return;st.start=e.target.value;save();render()};
$("go").onclick=()=>{const n=dayNo();if(n<1||n>90)return;if(!inTab(n)){st.tab=n>56?2:n>28?1:0;save();applyTab()}const el=$("day"+n);if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"center"})};
let armed=0;$("rs").onclick=function(){if(!armed){armed=1;this.textContent="Sure? Click again";setTimeout(()=>{armed=0;this.textContent="Reset"},3000);return}armed=0;this.textContent="Reset";st.done={};save();render()};
render();initDb();
</script>
</body>
</html>
